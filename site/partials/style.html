<style>
  /* Nunito, served from this site (no requests to third parties). SIL OFL 1.1: fonts/OFL-Nunito.txt. */
  @font-face { font-family: "Nunito"; font-style: normal; font-weight: 400 900; font-display: swap; src: url("{{page.root}}fonts/nunito-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  /* The same family as ohmigo's site: rounded type, warm background, a mascot. Voltaria's colour is the
     book's blue; ohmigo's green is kept for the one thing that is ohmigo's, the install button. */
  :root {
    --bg: #fbfaf5; --bg-alt: #eef2fa; --card: #ffffff; --fg: #14203a; --muted: #56627a; --line: #e2e6ee;
    --ink: #2f5bd0; --ink-strong: #1f3f9a; --ink-soft: #dfe7fb; --on-ink: #ffffff;
    --sun-soft: #fdf3c4; --sun-ink: #7a5600; --mark: #fde047;
    --go: #16a34a; --go-shadow: #0f7a36; --go-soft: #dcfce7; --go-text: #ffffff; --go-ink: #14532d;
    --old: #fde2e4; --old-ink: #9f1d2b;
    --code-bg: #f2f4f9;
    --shadow: 0 1px 2px rgba(20, 32, 58, .06), 0 10px 28px rgba(20, 32, 58, .07);
    --font: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1322; --bg-alt: #111a2d; --card: #172138; --fg: #e8edf8; --muted: #a2adc4; --line: #25304a;
      --ink: #8eaaff; --ink-strong: #c3d3ff; --ink-soft: #1c2a4f; --on-ink: #0b1430;
      --sun-soft: #39320f; --sun-ink: #fde68a; --mark: rgba(250, 204, 21, .42);
      --go: #4ade80; --go-shadow: #15803d; --go-soft: #14321f; --go-text: #052e16; --go-ink: #bbf7d0;
      --old: #3a1820; --old-ink: #ffb3bb; --code-bg: #0f1729;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1322; --bg-alt: #111a2d; --card: #172138; --fg: #e8edf8; --muted: #a2adc4; --line: #25304a;
    --ink: #8eaaff; --ink-strong: #c3d3ff; --ink-soft: #1c2a4f; --on-ink: #0b1430;
    --sun-soft: #39320f; --sun-ink: #fde68a; --mark: rgba(250, 204, 21, .42);
    --go: #4ade80; --go-shadow: #15803d; --go-soft: #14321f; --go-text: #052e16; --go-ink: #bbf7d0;
    --old: #3a1820; --old-ink: #ffb3bb; --code-bg: #0f1729;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 19px/1.6 var(--font); overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  a { color: var(--ink); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  b, strong { font-weight: 800; }
  mark { background: linear-gradient(transparent 58%, var(--mark) 58%); color: inherit; padding: 0 .06em; }
  code { font: .86em var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: .05em .35em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  section { padding-block: 76px; }
  #o-que-e, #porque, #como-funciona, #usar { scroll-margin-top: 64px; }
  .alt { background: var(--bg-alt); }
  h1, h2, h3 { line-height: 1.12; margin: 0; letter-spacing: -.012em; text-wrap: balance; }
  h1 { font-size: clamp(38px, 6.6vw, 62px); font-weight: 900; }
  h2 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 900; }
  h3 { font-size: 21px; font-weight: 800; }
  p { margin: 0; }
  .lead { font-size: clamp(19px, 2.2vw, 22px); color: var(--muted); max-width: 36em; }
  .eyebrow { align-self: flex-start; font-size: 14px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-strong); background: var(--ink-soft); padding: 4px 12px; border-radius: 999px; }
  .head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; }
  .skip { position: absolute; left: 12px; top: -80px; z-index: 40; background: var(--card); color: var(--fg); font-weight: 800; padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow); }
  .skip:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }
  #conteudo { scroll-margin-top: 80px; }
  #conteudo:focus { outline: none; }

  /* Header */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 18px; min-height: 64px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 23px; color: var(--fg); text-decoration: none; letter-spacing: -.01em; }
  .logo svg { width: 30px; height: 36px; }
  .links { display: flex; gap: 22px; margin-left: auto; }
  .links a { color: var(--muted); font-weight: 700; font-size: 16px; text-decoration: none; }
  .links a:hover { color: var(--fg); }
  .controls { display: flex; gap: 8px; margin-left: 4px; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
  .seg a, .seg button { font: 800 14px var(--font); color: var(--muted); background: none; border: 0; border-radius: 999px; min-width: 38px; height: 34px; padding: 0 10px;
    cursor: pointer; display: grid; place-items: center; text-decoration: none; }
  .seg svg { width: 18px; height: 18px; }
  .seg [aria-pressed="true"], .seg [aria-current="page"] { background: var(--ink-soft); color: var(--ink-strong); }
  @media (max-width: 820px) { .links { display: none; } .controls { margin-left: auto; } }
  @media (max-width: 420px) { .logo span { display: none; } .seg a, .seg button { min-width: 34px; padding: 0 8px; } }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 800 18px var(--font); text-decoration: none;
    border-radius: 999px; padding: 14px 26px; min-height: 54px; transition: transform .15s ease; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 20px; height: 20px; }
  .btn-main { background: var(--ink); color: var(--on-ink); box-shadow: 0 6px 0 var(--ink-strong), 0 12px 26px rgba(47, 91, 208, .3); }
  .btn-main:hover { transform: translateY(-2px); }
  .btn-ghost { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
  .btn-go { background: var(--go); color: var(--go-text); box-shadow: 0 6px 0 var(--go-shadow), 0 12px 26px color-mix(in srgb, var(--go) 30%, transparent); font-size: 20px; padding: 16px 30px; }
  .btn-go:hover { transform: translateY(-2px); }
  .btn-go svg { width: 30px; height: 34px; }

  /* Hero */
  .hero { padding-block: 44px 76px; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.12fr .88fr; gap: 36px; align-items: center; }
  .hero-text { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; }
  .chips { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips li { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px 5px 9px; }
  .chips svg { width: 18px; height: 18px; color: var(--go); }
  .stage { position: relative; display: grid; place-items: center; min-height: 360px; }
  .blob { position: absolute; width: min(90%, 390px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: radial-gradient(circle at 38% 34%, var(--sun-soft), var(--ink-soft) 70%); }
  .mascot { position: relative; width: min(300px, 70vw); max-width: 100%; animation: bob 3.4s ease-in-out infinite; filter: drop-shadow(0 18px 18px rgba(15, 23, 42, .16)); }
  .wave-book { transform-origin: 204px 150px; animation: wave 1.7s ease-in-out infinite; }
  .arm-wave { transform-origin: 196px 150px; animation: wave 1.6s ease-in-out infinite; }
  .blink { transform-origin: center 112px; animation: blink 4.6s infinite; }
  .bubble { position: absolute; top: 4%; right: 2%; background: var(--card); color: var(--fg); border-radius: 18px 18px 4px 18px; padding: 9px 15px; font-weight: 900; font-size: 17px; box-shadow: var(--shadow); max-width: 12em; line-height: 1.25; }
  .spark { position: absolute; width: 34px; animation: float 4s ease-in-out infinite; }
  .spark.s1 { top: 10%; left: 6%; } .spark.s2 { bottom: 14%; right: 6%; width: 26px; animation-delay: -1.4s; } .spark.s3 { bottom: 8%; left: 10%; width: 22px; animation-delay: -2.6s; }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  @keyframes wave { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(-20deg) } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-14px) rotate(8deg) } }
  @media (max-width: 820px) { .hero-grid { grid-template-columns: 1fr; } .stage { min-height: 300px; order: -1; } .mascot { width: min(230px, 60vw); } }

  /* What it is */
  .topics { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .topic { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .topic p { color: var(--muted); font-size: 17px; }
  .ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
  .ico svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tint-ink { background: var(--ink-soft); color: var(--ink-strong); }
  .tint-sun { background: var(--sun-soft); color: var(--sun-ink); }
  .tint-go { background: var(--go-soft); color: var(--go-ink); }
  .more { margin-top: 22px; color: var(--muted); font-weight: 700; }
  @media (max-width: 900px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .topics { grid-template-columns: 1fr; } }

  /* Why */
  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: center; }
  .why-grid > div { min-width: 0; }
  .why-text { display: flex; flex-direction: column; gap: 14px; }
  .pairs { display: flex; flex-direction: column; gap: 18px; }
  .pair { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .pair p { display: flex; gap: 12px; align-items: baseline; }
  .tag { flex: none; font-size: 13px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; border-radius: 8px; padding: 2px 8px; min-width: 64px; text-align: center; }
  .was .tag { background: var(--old); color: var(--old-ink); }
  .was s { color: var(--muted); text-decoration-color: var(--old-ink); text-decoration-thickness: 2px; }
  .now .tag { background: var(--go-soft); color: var(--go-ink); }
  .now span:last-child { font-weight: 800; }
  .src { font: 700 14px var(--mono); color: var(--ink); padding-left: 76px; }
  @media (max-width: 820px) { .why-grid { grid-template-columns: 1fr; gap: 28px; } }
  @media (max-width: 420px) { .pair p { flex-direction: column; gap: 4px; } .src { padding-left: 0; } }

  /* How it works */
  .how-grid { display: grid; grid-template-columns: 1fr minmax(0, 420px); gap: 44px; align-items: start; }
  .steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
  .step { display: grid; grid-template-columns: 52px 1fr; gap: 4px 16px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .step > * { min-width: 0; }
  .step .num { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 24px; background: var(--ink); color: var(--on-ink); }
  .step p { color: var(--muted); font-size: 17px; }
  .phone { background: var(--card); border-radius: 30px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .phone-top { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; color: var(--muted); padding: 2px 6px 10px; border-bottom: 1px solid var(--line); }
  .phone-top .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--go); }
  .msg { border-radius: 20px; padding: 12px 16px; font-size: 17px; line-height: 1.5; max-width: 92%; }
  .me { align-self: flex-end; background: var(--ink); color: var(--on-ink); border-bottom-right-radius: 6px; }
  .ai { align-self: flex-start; background: var(--bg-alt); border-bottom-left-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
  .tool { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--ink-strong); background: var(--ink-soft); border-radius: 999px; padding: 4px 12px 4px 6px; }
  .tool svg { width: 20px; height: 24px; }
  .cite { align-self: flex-start; font: 700 13px var(--mono); color: var(--ink-strong); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
  .fine { font-size: 14px; color: var(--muted); margin-top: 12px; text-align: center; }
  @media (max-width: 880px) { .how-grid { grid-template-columns: 1fr; } }

  /* How to use it */
  .install { display: grid; grid-template-columns: minmax(0, .8fr) 1.2fr; gap: 36px; align-items: center; background: var(--card); border-radius: 32px; box-shadow: var(--shadow); padding: 44px; border: 2px solid var(--go-soft); }
  .duo { position: relative; display: flex; justify-content: center; align-items: flex-end; min-height: 260px; }
  .duo::before { content: ""; position: absolute; inset: 10% 6% 0; border-radius: 50%; background: radial-gradient(circle, var(--go-soft), transparent 70%); }
  .duo svg { position: relative; width: 46%; max-width: 170px; }
  .duo .d-ohmi { transform: rotate(-6deg); margin-right: -14px; }
  .duo .d-book { transform: rotate(6deg); }
  .install-text { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .install-text .eyebrow { color: var(--go-ink); background: var(--go-soft); }
  .mini-steps { margin: 4px 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
  .mini-steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; font-weight: 700; }
  .mini-steps li::before { content: counter(s); flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 16px; background: var(--go-soft); color: var(--go-ink); transform: translateY(5px); }
  .install .btn-go { align-self: flex-start; margin-top: 6px; }
  .note { font-size: 15px; color: var(--muted); }
  @media (max-width: 820px) { .install { grid-template-columns: 1fr; padding: 28px 22px; } .duo { min-height: 190px; } }

  /* Under the hood */
  .nerd-sec { padding-block: 0 76px; }
  .nerd { background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  .nerd summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-radius: var(--radius); }
  .nerd summary::-webkit-details-marker { display: none; }
  .braces { flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font: 800 18px var(--mono); background: var(--code-bg); color: var(--ink); border: 1px solid var(--line); }
  .sum-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .sum-text b { font-size: 20px; }
  .sum-text small { color: var(--muted); font-size: 15px; }
  .chev { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--bg-alt); display: grid; place-items: center; transition: transform .25s ease; }
  .chev svg { width: 18px; height: 18px; }
  .nerd[open] .chev { transform: rotate(180deg); }
  .nerd-body { padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 24px; border-top: 1px dashed var(--line); }
  .nerd[open] .nerd-body { animation: drop .3s ease; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
  .nerd-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 28px; }
  .nerd-grid > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .nerd-grid h3 { font-size: 17px; }
  .nerd-grid p { font-size: 16px; color: var(--muted); }
  .codebox { overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 16px; }
  .codebox pre { margin: 0; padding: 18px 20px; font: 14px/1.6 var(--mono); color: var(--fg); }
  .codebox .k { color: var(--ink); font-weight: 700; } .codebox .s { color: var(--go-ink); } .codebox .dim { color: var(--muted); }
  .ids { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .ids code { display: inline-block; font-size: 14px; padding: 4px 10px; border-radius: 999px; }
  .repo { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; text-decoration: none; }
  .repo svg { width: 20px; height: 20px; }
  @media (max-width: 900px) { .nerd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .nerd-grid { grid-template-columns: 1fr; } .nerd summary { padding: 16px; } .nerd-body { padding-inline: 16px; } }

  /* Privacy page */
  .prose { max-width: 42em; display: flex; flex-direction: column; gap: 18px; padding-block: 56px 80px; }
  .prose h1 { font-size: clamp(32px, 5vw, 46px); }
  .prose h2 { font-size: 24px; margin-top: 18px; }
  .prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
  .prose .when { color: var(--muted); font-size: 16px; }
  .prose table { border-collapse: collapse; width: 100%; font-size: 16px; }
  .prose th, .prose td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .prose th { font-weight: 800; }

  /* Footer */
  footer { border-top: 1px solid var(--line); }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 28px; font-size: 15px; color: var(--muted); }
  .foot .logo { font-size: 19px; }
  .foot .logo svg { width: 24px; height: 28px; }
  .foot nav { display: flex; gap: 14px; margin-left: auto; }
  .foot nav a { font-weight: 700; }

  .defs { position: absolute; width: 0; height: 0; }
  .chat { margin: 0; }

  /* Appearance menu: theme and vision */
  .pref { position: relative; }
  .pref-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .pref-btn svg { width: 22px; height: 22px; }
  .pref-btn[aria-expanded="true"] { background: var(--ink-soft); color: var(--ink-strong); }
  .pref-panel { position: absolute; right: 0; top: calc(100% + 10px); z-index: 25; width: min(320px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 16px 16px 4px; }
  .pref-grp { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pref-h { width: 100%; font-weight: 800; font-size: 15px; color: var(--muted); }
  .pref-grp button { display: inline-flex; align-items: center; gap: 6px; font: 800 15px var(--font); color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; }
  .pref-grp button svg { width: 18px; height: 18px; }
  .pref-grp button[aria-pressed="true"] { background: var(--ink-soft); color: var(--ink-strong); border-color: var(--ink); }
  .pref-d { display: none; width: 100%; font-size: 14px; line-height: 1.45; color: var(--muted); }
  #prefVision [data-vision="cb"][aria-pressed="true"] ~ #prefCbD, #prefVision [data-vision="hc"][aria-pressed="true"] ~ #prefHcD { display: block; }

  /* Vision: colour blindness. The green/red pairs (go and old) become orange and violet, which stay
     apart for red-green and blue-yellow deficiencies; meaning is also carried by words and strike-through. */
