# Content checks: the same scripts run locally (see CONTRIBUTING.md).
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-skills.py
      - run: scripts/check-knowledge.py
      - run: scripts/check-sources.sh
      - run: scripts/build-site.py --check
      - run: scripts/build-plugin.py 0.0.0 "$RUNNER_TEMP/plugin"
