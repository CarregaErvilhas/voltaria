# Every commit in a PR must carry a Signed-off-by matching its author (see
# CONTRIBUTING.md). Same check as scripts/check-dco.sh, which runs locally.
name: DCO
on: pull_request
permissions:
  contents: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
