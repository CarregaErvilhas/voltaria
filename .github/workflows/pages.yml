# Builds the website (scripts/build-site.py: site/ plus the topic list and llms.txt from skills/ and
# knowledge/) and publishes it on GitHub Pages at https://voltaria.ocarroeletrico.com/.
# Runs when anything the build reads changes on main, or by hand.
# One-time setup in the repo settings: Pages, Source "GitHub Actions", custom domain
# voltaria.ocarroeletrico.com (a CNAME record for it pointing to carregaervilhas.github.io).
name: Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "skills/**"
      - "knowledge/**"
      - "glossario.md"
      - "scripts/build-site.py"
      - "scripts/check-skills.py"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/build-site.py --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
